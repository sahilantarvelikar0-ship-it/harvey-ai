<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#091834" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="512" height="512" rx="128" fill="none" stroke="#22d3ee" stroke-opacity="0.2" stroke-width="4" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#coreGlow)" />

  <!-- Outer HUD Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-dasharray="14 10" filter="url(#glow)" />
  
  <!-- Middle Segmented Ring -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="30 18" stroke-opacity="0.7" />

  <!-- Inner Arc Marks -->
  <circle cx="256" cy="256" r="80" fill="none" stroke="#67e8f9" stroke-width="3" stroke-opacity="0.9" />

  <!-- Center Core Beacon -->
  <circle cx="256" cy="256" r="44" fill="#0369a1" filter="url(#glow)" />
  <circle cx="256" cy="256" r="32" fill="#22d3ee" />
  <circle cx="256" cy="256" r="16" fill="#ffffff" />

  <!-- HARVEY H Monogram -->
  <path d="M236 216 V296 M276 216 V296 M236 256 H276" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
</svg>
